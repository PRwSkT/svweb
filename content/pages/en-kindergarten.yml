sections:
  - title: Confidence via Bilinguals Program
    icon: globe
    body: >-
      Because English is the gateway to future opportunities, we implement a Co-Teaching model (1 Thai teacher and 1 native English teacher) in every classroom. This allows children to absorb natural accents and grammar, building their confidence in daily communication.
  - title: The 50:50:25 Ratio
    icon: pie-chart
    body: >-
      We maximize learning efficiency by allocating 50% for core Thai subjects, 50% for English subjects (e.g., Math, Science, Phonics, Art) taught by native speakers, and 25% for integrated activities designed to build essential life skills.
  - title: Social & Critical Thinking
    icon: users
    body: >-
      Through real-life language input and play-based learning, we foster critical thinking and social skills, preparing students for the wider world and ensuring they can solve problems effectively.
  - title: Safe & Nurturing Environment
    icon: heart
    body: >-
      Our classrooms and play areas are designed to stimulate learning while prioritizing safety. With close supervision from our teachers, every child feels like they are in a happy second home.
