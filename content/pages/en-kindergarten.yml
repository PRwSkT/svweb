sections:
  - title: Why the Bilingual Program at SV?
    body: >-
      Because English is the gateway to future opportunities. We implement a Co-Teaching model (1 Thai teacher and 1 native English teacher) in every classroom, allowing children to absorb accents and grammar as naturally as their mother tongue.
  - title: The 50:50:25 Ratio
    body: >-
      We allocate time intensively to maximize effectiveness: 50% for core Thai subjects, 50% for English subjects (e.g., Math, Science, Phonics, Art) taught by native speakers, and 25% for integrated activities to build life skills.
  - title: Confident Communication
    body: >-
      We encourage students to express themselves through real-life language input and play. We foster social skills and critical thinking to prepare them for the wider world.
