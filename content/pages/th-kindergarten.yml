sections:
  - title: ทำไมต้อง Bilingual Program ที่ SV?
    body: >-
      เพราะภาษาอังกฤษคือหน้าต่างสู่โอกาสในอนาคต เราจัดการเรียนการสอนแบบ Co-Teaching (ครูไทย 1 ท่าน และครูเจ้าของภาษา 1 ท่าน) ในทุกห้องเรียน เพื่อให้เด็กซึมซับสำเนียงและไวยากรณ์อย่างเป็นธรรมชาติราวกับภาษาแม่
  - title: สัดส่วนเวลาเรียนแบบ 50:50:25
    body: >-
      เราแบ่งเวลาเรียนอย่างเข้มข้นเพื่อให้เกิดประสิทธิภาพสูงสุด โดย 50% เป็นวิชาพื้นฐานภาษาไทย, 50% เป็นรายวิชาภาษาอังกฤษ (เช่น Math, Science, Phonics, Art) ดำเนินการสอนโดยครูเจ้าของภาษา และอีก 25% เป็นกิจกรรมบูรณาการเพื่อเสริมสร้างทักษะชีวิต
  - title: สร้างความมั่นใจและการสื่อสาร (Confident Communication)
    body: >-
      เน้นให้ผู้เรียนกล้าแสดงออกผ่านสถานการณ์จำลอง (Real-life Language Input) และการเล่น ส่งเสริมทักษะทางสังคม (Social Skills) และกระบวนการคิดวิเคราะห์ (Critical Thinking) ให้พร้อมสำหรับโลกกว้าง
