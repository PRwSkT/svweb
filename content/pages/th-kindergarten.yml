title: อนุบาล (Kindergarten)
eyebrow: รับนักเรียนอายุ 3-6 ปี
summary: >-
  โปรแกรมสองภาษาปฐมวัย (Bilingual Program) ที่เน้นการใช้ภาษาในสถานการณ์จำลอง (Real-life Language Input) ผ่านการเล่นและการเรียนรู้ (Play & Learn) เพื่อสร้างความมั่นใจและความเป็นผู้นำ
sections:
  - title: ภาคสองภาษา (Bilingual Program)
    body: >-
      ร่วมสอนโดยครูประจำชั้นชาวไทยและครูเจ้าของภาษาอังกฤษ (1 Thai teacher + 1 native English teacher) สัดส่วนเวลาเรียน ภาษาไทย 50%, ภาษาอังกฤษ 50%, และบูรณาการ 25% ครอบคลุมวิชาภาษาอังกฤษ, คณิตศาสตร์, วิทยาศาสตร์, โฟนิกส์, และศิลปะ
  - title: สร้างความมั่นใจกล้าแสดงออก (Builds Confident English Speaking)
    body: >-
      ส่งเสริมให้เด็กกล้าพูด กล้าสื่อสาร ผ่านการบูรณาการภาษาอังกฤษในกิจกรรมต่างๆ สร้างความเป็นผู้นำและความกล้าแสดงออกตั้งแต่ระดับปฐมวัย
  - title: พัฒนาทักษะการคิดและการสื่อสาร (Develops Social & Critical Thinking Skills)
    body: >-
      เน้นการทำงานร่วมกับผู้อื่น (Social Skills) และฝึกกระบวนการคิดวิเคราะห์อย่างสมวัย ให้เด็กสามารถแก้ไขปัญหาและเรียนรู้จากสภาพแวดล้อมได้อย่างมีประสิทธิภาพ
