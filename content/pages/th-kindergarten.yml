title: อนุบาล (Kindergarten)
eyebrow: รับนักเรียนอายุ 3-6 ปี
summary: >-
  หลักสูตร Bilinguals Program เต็มรูปแบบ ที่ออกแบบมาเพื่อเสริมสร้างพัฒนาการทั้ง 4 ด้าน ผ่านแนวคิด Play-Based Learning พร้อมการดูแลอย่างใกล้ชิดด้วยระบบ Co-Teaching
chart:
  th:
    title: "สัดส่วนเวลาเรียน (Bilinguals Program)"
