        value: 25
        color: "var(--sv-gold)"
sections:
  - title: สร้างความมั่นใจผ่าน Bilinguals Program
    icon: globe
    body: >-
      เพราะภาษาอังกฤษคือหน้าต่างสู่โอกาสในอนาคต เราจัดการเรียนการสอนแบบ Co-Teaching (ครูไทย 1 ท่าน และครูเจ้าของภาษา 1 ท่าน) ในทุกห้องเรียน เพื่อให้เด็กซึมซับสำเนียงและไวยากรณ์อย่างเป็นธรรมชาติราวกับภาษาแม่ เด็กๆ จะกล้าสื่อสารและมีความมั่นใจในการใช้ภาษาอังกฤษในชีวิตประจำวัน
  - title: สัดส่วนเวลาเรียนแบบ 50:50:25
    icon: pie-chart
    body: >-
      เราแบ่งเวลาเรียนอย่างเข้มข้นเพื่อให้เกิดประสิทธิภาพสูงสุด โดย 50% เป็นวิชาพื้นฐานภาษาไทย, 50% เป็นรายวิชาภาษาอังกฤษ (เช่น Math, Science, Phonics, Art) ดำเนินการสอนโดยครูเจ้าของภาษา และอีก 25% เป็นกิจกรรมบูรณาการเพื่อเสริมสร้างทักษะชีวิตรอบด้าน
  - title: ทักษะทางสังคมและการคิดวิเคราะห์
    icon: users
    body: >-
      เน้นให้ผู้เรียนกล้าแสดงออกผ่านสถานการณ์จำลอง (Real-life Language Input) และการเล่นแบบ Play-based Learning ส่งเสริมทักษะทางสังคม (Social Skills) และกระบวนการคิดวิเคราะห์ (Critical Thinking) ให้พร้อมสำหรับโลกกว้างและการเติบโต
  - title: สภาพแวดล้อมที่ปลอดภัยและอบอุ่น
    icon: heart
    body: >-
      โรงเรียนออกแบบพื้นที่และห้องเรียนที่กระตุ้นการเรียนรู้ ปลอดภัย และมีครูดูแลอย่างใกล้ชิด ให้เด็กทุกคนรู้สึกเหมือนอยู่บ้านหลังที่สองที่มีความสุขและพร้อมเรียนรู้ในทุกๆ วัน
