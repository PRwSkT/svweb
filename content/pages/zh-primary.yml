title: 小学 (Primary School)
eyebrow: 招收 6 岁及以上学生
summary: >-
  小学阶段提供两大课程：双语课程 (Bilinguals Program) 与普通课程 (General Program)，以满足不同学生的学习风格和未来目标。
chart:
  zh:
    title: "课程比例 (双语课程)"
    data:
      - label: "英语 (母语外教)"
        value: 50
        color: "var(--sv-crimson)"
      - label: "泰语 (核心科目)"
        value: 50
        color: "var(--sv-navy)"
      - label: "综合与活动"
        value: 25
        color: "var(--sv-gold)"
sections:
  - title: 双语课程 (Bilinguals Program)
    icon: globe
    body: >-
      延续幼儿园的双语环境，实行 50% 泰语和 50% 英语的教学比例。核心科目（数学、科学、自然拼读、美术）均由英语母语教师授课，确保卓越的国际化学术水平。此外，双语课程的学生也同样参与普通课程中的所有专业活动，包括泰式/西方音乐、视觉艺术、体育（足球、游泳、跆拳道）、机器人与计算机以及珠心算。
  - title: 普通课程 (General Program)
    icon: award
    body: >-
      侧重于英语沟通与全面发展的标准课程，同时通过丰富多样的科目培养个人特长，旨在充分发掘每个孩子的潜能。这些科目涵盖了泰式/西方音乐、视觉艺术、体育（足球、游泳、跆拳道）、机器人与计算机以及珠心算。
  - title: 增强中文技能
    icon: message-circle
    body: >-
      所有学生均将学习中文，以开阔国际视野，并提升其在数字时代的竞争力，为接受全球化教育打下坚实基础。
  - title: 领导力发展
    icon: star
    body: >-
      在小学阶段，我们鼓励学生通过项目式学习 (Project-Based Learning) 探索自我并勇于表达观点，着重培养批判性思维与解决现实问题的能力。
