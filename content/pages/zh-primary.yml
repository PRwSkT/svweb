sections:
  - title: 双语课程 (Bilingual Program)
    body: >-
      延续幼儿园的双语环境，实行 50% 泰语和 50% 英语的教学比例。核心科目（数学、科学、自然拼读、美术）均由英语母语教师授课，确保卓越的国际化学术水平。
  - title: 普通课程 (General Program)
    body: >-
      侧重于沟通英语的全面发展课程，同时通过丰富多样的科目培养个人特长，如泰式/西方音乐、视觉艺术、体育（足球、游泳、跆拳道）、机器人与计算机以及珠心算。
  - title: 中文技能提升
    body: >-
      普通课程的学生还将接受中文培训，以开阔视野并提升在数字化时代的竞争力。
