  th: ["ภาคสามภาษา (Trilingual Program) | โรงเรียนสมคิดวิทยา ระยอง", "เตรียมพบกับหลักสูตรใหม่ที่ออกแบบมาเพื่อพัฒนาศักยภาพผู้เรียนอย่างรอบด้าน เสริมรากฐานสำคัญด้านภาษา ดิจิทัล และการคิดสร้างสรรค์ สมัครเรียนตั้งแต่ปฐมวัยถึงประถมที่โรงเรียนสมคิดวิทยา จ.ระยอง"]
