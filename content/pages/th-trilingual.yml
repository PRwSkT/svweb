title: ภาคสามภาษา (Trilingual Program)
eyebrow: Coming Soon
summary: >-
  เตรียมพบกับหลักสูตรใหม่ที่ออกแบบมาเพื่อพัฒนาศักยภาพผู้เรียนอย่างรอบด้าน เสริมรากฐานสำคัญด้านภาษา ดิจิทัล และการคิดสร้างสรรค์
sections:
  - title: ร่วมสอนโดยครู 3 สัญชาติ
    body: >-
      สอนโดยครูเจ้าของภาษาอังกฤษ, จีน และครูไทย (Co-taught by native English, Chinese speakers and Thai teachers)
  - title: โครงสร้างเวลาเรียน (25:25:25:25)
    body: >-
      แบ่งสัดส่วนการเรียนเป็น ภาษาไทย 25%, ภาษาอังกฤษ 25%, ภาษาจีน 25% และแบบบูรณาการ 25% เพื่อให้ผู้เรียนได้ซึมซับภาษาอย่างเต็มที่ในทุกมิติ
