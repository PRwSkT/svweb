title: ประถมศึกษา
eyebrow: พื้นฐานแข็งแรง ทักษะพร้อม
summary: >-
  ระดับประถมศึกษาวางรากฐานวิชาการ ภาษา การคิดวิเคราะห์ และการทำโครงงาน
  เพื่อให้เด็กพร้อมก้าวสู่ระดับถัดไป
sections:
  - title: วิชาหลัก
    body: ภาษาไทย อังกฤษ คณิตศาสตร์ วิทยาศาสตร์ สังคม และทักษะดิจิทัล
  - title: PBL
    body: เรียนรู้ผ่านโจทย์จริงและการนำเสนอผลงาน
