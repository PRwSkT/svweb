title: ประถมศึกษา (Primary School)
eyebrow: รับนักเรียนอายุ 6 ปีขึ้นไป
summary: >-
  ระดับประถมศึกษาเปิดสอน 2 โครงการ ได้แก่ ภาคสองภาษา (Bilingual Program) และ ภาคสามัญ (General Program) เพื่อรองรับเป้าหมายและสไตล์การเรียนรู้ที่หลากหลายของนักเรียนแต่ละคน
chart:
  th:
