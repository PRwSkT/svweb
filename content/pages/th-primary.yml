sections:
  - title: ภาคสองภาษา (Bilingual Program)
    body: >-
      สานต่อความเข้มข้นจากระดับอนุบาล ด้วยสัดส่วนการเรียนภาษาอังกฤษ 50% และภาษาไทย 50% โดยนักเรียนจะได้เรียนวิชาหลัก (คณิตศาสตร์ วิทยาศาสตร์ โฟนิกส์ ศิลปะ) เป็นภาษาอังกฤษกับครูเจ้าของภาษา เพื่อพัฒนาความเป็นเลิศทางวิชาการระดับสากล
  - title: ภาคสามัญ (General Program)
    body: >-
      หลักสูตรมาตรฐานที่เน้นการพัฒนาทักษะรอบด้าน มุ่งเน้นการใช้ภาษาอังกฤษเพื่อการสื่อสาร พร้อมส่งเสริมความถนัดเฉพาะตัวผ่านวิชาเสริมต่างๆ เช่น ดนตรีไทย-สากล, ทัศนศิลป์, กีฬา (ฟุตบอล, ว่ายน้ำ, เทควันโด), Robotics & Computer, และจินตคณิต
  - title: ภาษาจีนเสริมทักษะ (Chinese Skills)
    body: >-
      นักเรียนในภาคสามัญยังได้รับการเสริมทักษะภาษาจีน เพื่อเปิดโลกทัศน์และเพิ่มขีดความสามารถในการแข่งขันในยุคดิจิทัล
