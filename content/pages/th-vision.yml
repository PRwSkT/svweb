title: วิสัยทัศน์ พันธกิจ และค่านิยม
eyebrow: เกี่ยวกับเรา
summary: >-
  เรามุ่งสร้างผู้เรียนที่มีความสุข คิดเป็น สื่อสารได้หลายภาษา
  และพร้อมเป็นพลเมืองโลกที่รับผิดชอบต่อสังคม
sections:
  - title: Vision
    body: เป็นสถาบันการศึกษาสองภาษาชั้นนำที่ได้รับความไว้วางใจสูงสุดในระดับภูมิภาค
  - title: Mission
    body: มุ่งสร้างสรรค์ประสบการณ์การเรียนรู้ที่สมดุล ผสานความเป็นเลิศทางวิชาการ ทักษะทางภาษา คุณธรรมจริยธรรม และทักษะที่จำเป็นสำหรับอนาคต
  - title: Values
    body: Care, Curiosity, Confidence, Community
