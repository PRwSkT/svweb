seo:
  th: ["วิสัยทัศน์ พันธกิจ และค่านิยม | โรงเรียนสมคิดวิทยา ระยอง", "เรามุ่งสร้างผู้เรียนที่มีความสุข คิดเป็น สื่อสารได้หลายภาษา และพร้อมเป็นพลเมืองโลกที่รับผิดชอบต่อสังคม สมัครเรียนตั้งแต่ปฐมวัยถึงประถมที่โรงเรียนสมคิดวิทยา จ.ระยอง"]
