title: บ่มเพาะพลเมืองโลก ตั้งแต่ก้าวแรก
eyebrow: โรงเรียนสมคิดวิทยา ครบรอบ 66 ปี
summary: >-
  โรงเรียนสองภาษาเตรียมอนุบาลถึงประถมศึกษา จ.ระยอง ที่ผสาน MEP, Active Learning,
  PBL และเทคโนโลยี เพื่อเตรียมเด็กให้พร้อมทั้งทักษะชีวิต ภาษา และความมั่นใจ
sections:
  - title: จุดเด่นของ SV
    body: >-
      หลักสูตร MEP ที่ใช้ภาษาอังกฤษอย่างเป็นธรรมชาติ, ห้องเรียนแบบ Active
      Learning, โครงงาน PBL, และการใช้ข้อมูลเพื่อดูแลพัฒนาการรายบุคคล
  - title: ระดับชั้นที่เปิดสอน
    body: >-
      เตรียมอนุบาล อนุบาล และประถมศึกษา
      พร้อมเส้นทางการเรียนรู้ที่ต่อเนื่องจากความมั่นใจในห้องเรียนสู่ทักษะโลกจริง
  - title: เสียงจากผู้ปกครอง
    body: >-
      เว็บไซต์เตรียมพื้นที่สำหรับ testimonial จริง
      เพื่อช่วยให้ผู้ปกครองใหม่เห็นผลลัพธ์และบรรยากาศของโรงเรียนอย่างเป็นรูปธรรม
seo:
  - โรงเรียนสมคิดวิทยา — โรงเรียนสองภาษา เตรียมอนุบาล-ประถม จ.ระยอง
  - >-
    โรงเรียนสมคิดวิทยา โรงเรียนสองภาษา (MEP) เตรียมอนุบาลถึง ป.6 จ.ระยอง สอนแบบ
    Active Learning และ PBL สมัครเรียนหรือนัดเยี่ยมชมวันนี้
type: home
