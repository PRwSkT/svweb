title: บ่มเพาะพลเมืองโลก ตั้งแต่ก้าวแรก
eyebrow: โรงเรียนสมคิดวิทยา ครบรอบ 66 ปี
summary: >-
  โรงเรียนสองภาษาเตรียมอนุบาลถึงประถมศึกษา จ.ระยอง ที่ผสานความโดดเด่นของหลักสูตร Bilinguals Program, กระบวนการเรียนรู้แบบ Active Learning,
  Project-Based Learning และการใช้เทคโนโลยี เพื่อบ่มเพาะทักษะชีวิต ความสามารถทางภาษา และความมั่นใจให้กับผู้เรียน
sections:
  - title: จุดเด่นของ SV
    body: >-
      โดดเด่นด้วยหลักสูตร Bilinguals Program ที่ส่งเสริมการใช้ภาษาอังกฤษอย่างเป็นธรรมชาติ ผสานห้องเรียนแบบ Active
      Learning การเรียนรู้ผ่านโครงงาน (PBL) และการวิเคราะห์ข้อมูลเพื่อติดตามพัฒนาการของผู้เรียนเป็นรายบุคคล
  - title: ระดับชั้นที่เปิดสอน
    body: >-
      เปิดสอนตั้งแต่ระดับเตรียมอนุบาล ปฐมวัย จนถึงประถมศึกษา
      ด้วยเส้นทางการเรียนรู้ที่ต่อเนื่อง เพื่อสร้างความมั่นใจในห้องเรียนและต่อยอดสู่ทักษะการใช้ชีวิตในโลกกว้าง
seo:
  - โรงเรียนสมคิดวิทยา — โรงเรียนสองภาษา เตรียมอนุบาล-ประถม จ.ระยอง
  - >-
    โรงเรียนสมคิดวิทยา โรงเรียนสองภาษา (Bilinguals Program) เตรียมอนุบาลถึง ป.6 จ.ระยอง จัดการเรียนรู้แบบ
    Active Learning และ PBL สร้างความมั่นใจให้ผู้เรียน สมัครเรียนหรือนัดเยี่ยมชมวันนี้
type: home
