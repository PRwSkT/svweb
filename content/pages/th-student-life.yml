seo:
  th: ["ชีวิตในโรงเรียนที่เด็กอยากมาเรียน | โรงเรียนสมคิดวิทยา ระยอง", "สัมผัสบรรยากาศจริงของการเรียนรู้ กิจกรรม ชมรม และประสบการณ์ที่เปิดโอกาสให้เด็กๆ ได้ค้นพบศักยภาพของตนเองนอกห้องเรียน สมัครเรียนที่โรงเรียนสมคิดวิทยา จ.ระยอง"]

sections:
  - title: "บรรยากาศการเรียนรู้อย่างมีความสุข (A Day at SV)"
    icon: "sun"
    body: "เริ่มต้นวันใหม่ด้วยรอยยิ้ม กิจกรรมโฮมรูมที่อบอุ่น และการเรียนรู้ผ่านการลงมือทำ (Active Learning)"
  - title: "สิ่งแวดล้อมที่ปลอดภัยและทันสมัย (Facilities)"
    icon: "shield"
    body: "ห้องเรียนที่ออกแบบมาเพื่อส่งเสริมพัฒนาการ พร้อมระบบรักษาความปลอดภัยและห้องพยาบาลที่ได้มาตรฐาน"
  - title: "โภชนาการและสุขภาพ (Nutrition & Well-being)"
    icon: "coffee"
    body: "อาหารกลางวันที่สะอาด ปลอดภัย ถูกหลักโภชนาการ และใส่ใจเรื่องอาการแพ้อาหารของเด็กแต่ละคน"
  - title: "ชมรมและกิจกรรมเสริมทักษะ (Clubs & Activities)"
    icon: "star"
    body: "เปิดโอกาสให้เด็กๆ ค้นพบตัวเองผ่านชมรมศิลปะ ดนตรี กีฬา และวิทยาศาสตร์"
