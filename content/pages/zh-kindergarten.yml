image: real-2.jpg
title: 幼儿园 (Kindergarten)
eyebrow: 招收 3-6 岁儿童
summary: >-
  全面的双语课程，通过基于游戏的学习 (Play-Based Learning) 促进儿童四大领域的发展，并在联合教学系统 (Co-Teaching) 的密切指导下进行。
chart:
  zh:
    title: "课程比例 (双语课程)"
    data:
      - label: "英语 (母语外教)"
        value: 50
        color: "var(--sv-crimson)"
      - label: "泰语 (核心科目)"
        value: 50
        color: "var(--sv-navy)"
      - label: "综合与活动"
        value: 25
        color: "var(--sv-gold)"
sections:
  - title: 建立自信的双语课程
    icon: globe
    body: >-
      因为英语是通向未来机遇的窗口。我们在每个教室实施联合教学模式（1名泰籍教师和1名母语为英语的外籍教师），让孩子们像学习母语一样自然吸收口音和语法，在日常沟通中充满自信。
  - title: 50:50:25 比例
    icon: pie-chart
    body: >-
      我们集中分配时间以实现最大效率：50% 为泰语基础科目，50% 为英语科目（如数学、科学、自然拼读、美术）由外教授课，另外 25% 为综合活动以培养生活技能。
  - title: 社交技能与批判性思维
    icon: users
    body: >-
      通过真实的语言输入和基于游戏的学习，我们培养学生的批判性思维和社交技能，使他们具备解决问题的能力，为走向更广阔的世界做好准备。
  - title: 安全温暖的环境
    icon: heart
    body: >-
      我们的教室和游乐区经过精心设计，旨在激发学习兴趣，同时将安全放在首位。在教师的密切关注下，每个孩子都会感觉身处于一个快乐的第二个家。
