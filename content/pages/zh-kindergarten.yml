image: real-2.jpg
title: 幼儿园 (Kindergarten)
eyebrow: 招收 3-6 岁儿童
summary: >-
  全面的双语课程，通过基于游戏的学习 (Play-Based Learning) 促进儿童四大领域的发展，并在联合教学系统 (Co-Teaching) 的密切指导下进行。
chart:
  zh:
    title: "课程比例 (双语课程)"
    data:
      - label: "英语 (母语外教)"
        value: 50
        color: "var(--sv-crimson)"
      - label: "泰语 (核心科目)"
        value: 50
        color: "var(--sv-navy)"
      - label: "综合与活动"
        value: 25
        color: "var(--sv-gold)"
sections:
  - title: 建立自信的双语课程
    icon: globe
    body: >-
      英语是开启未来机遇的窗户。我们在每个教室均推行协同授课模式（1名泰籍教师与1名英语母语外教），让孩子们在沉浸式环境中自然习得纯正发音与语法，在日常沟通中展现自信。
  - title: 50:50:25 比例
    icon: pie-chart
    body: >-
      我们集中分配时间以实现最大效率：50% 为泰语基础科目，50% 为英语科目（如数学、科学、自然拼读、美术）由外教授课，另外 25% 为综合活动以培养生活技能。
  - title: 社交技能与批判性思维
    icon: users
    body: >-
      通过地道的语言输入与基于游戏的学习（Play-Based Learning），我们注重培养孩子们的批判性思维与社交技能，使其具备解决实际问题的能力，为走向更广阔的世界做好准备。
  - title: 安全温暖的环境
    icon: heart
    body: >-
      我们的教室与游乐区经过精心设计，旨在激发学习兴趣，同时始终将安全放在首位。在教师的悉心呵护下，每一个孩子都能在这里感受到“第二个家”的温馨与快乐。
