sections:
  - title: 为什么选择 SV 的双语课程？
    body: >-
      因为英语是通向未来机遇的窗口。我们在每个教室实施联合教学模式（1名泰籍教师和1名母语为英语的外籍教师），让孩子们像学习母语一样自然吸收口音和语法。
  - title: 50:50:25 比例
    body: >-
      我们集中分配时间以实现最大效率：50% 为泰语基础科目，50% 为英语科目（如数学、科学、自然拼读、美术）由外教授课，另外 25% 为综合活动以培养生活技能。
  - title: 自信沟通
    body: >-
      我们鼓励学生通过真实的语言输入和游戏来表达自己，培养社交技能和批判性思维，为走向更广阔的世界做好准备。
