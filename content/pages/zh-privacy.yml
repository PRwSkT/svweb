lang: "zh"
id: "privacy"
path: "/privacy/"
title: "隐私声明"
eyebrow: "Privacy Policy"
summary: "我们如何根据 PDPA 收集、使用和保护您的个人数据。"
type: "privacy"
sections:
  - title: "1. 我们收集的信息"
    body: "当您填写网站上的表格（申请表、预约参观表或联系表）时，我们会收集：\n- 姓名\n- 电话号码\n- 电子邮件\n- 感兴趣的年级\n- 您的留言\n\n我们不通过本网站收集财务、健康或其他敏感数据。"
  - title: "2. 用途"
    body: "我们使用您的信息来：\n- 回复您的咨询\n- 安排学校参观\n- 处理入学申请\n- 提供您所请求的信息\n\n我们不会将您的数据用于上述以外的任何目的。"
  - title: "3. 数据接收方"
    body: "您的信息仅由 Somkidvittaya学校 的行政和招生团队接收。我们不出售、出租或向第三方分享您的数据，法律要求除外。"
  - title: "4. 保留期限"
    body: "我们自提交之日起保留您的数据不超过两年，或至招生流程结束，以先到者为准。之后，您的数据将被删除。"
  - title: "5. 您的权利"
    body: "根据 PDPA，您有权：\n- 访问您的个人数据\n- 更正不准确的数据\n- 请求删除您的数据\n- 限制数据处理\n- 撤回同意"
  - title: "6. 联系方式"
    body: "如有关于个人数据的问题，请联系：\nSomkidvittaya学校（行政办公室）\n泰国罗勇府罗勇直辖县 Tha Pradu 区 Lang Wat Pa 路 80/5 号，邮政编码：21000，泰国\n电话：(+66)38-611251\n电子邮件：mail@somkidvittaya.ac.th"
