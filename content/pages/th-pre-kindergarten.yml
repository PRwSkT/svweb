title: เตรียมนุบาล (Nursery)
eyebrow: รับนักเรียนอายุ 1.5 ปีขึ้นไป
summary: >-
  ดูแลก้าวแรกของลูกน้อยอย่างอบอุ่นและปลอดภัย พร้อมปูพื้นฐานการเรียนรู้สองภาษา (Thai-English) แบบเป็นธรรมชาติผ่านกิจกรรมที่เหมาะสมกับวัย เพื่อเตรียมความพร้อมสู่โลกกว้าง
sections:
  - title: 6 Sensory Play (กระตุ้นพัฒนาการรอบด้าน)
    body: เราจัดกิจกรรมผ่านประสบการณ์รับสัมผัสทั้ง 6 (6 Sensory Play) ซึ่งเป็นหัวใจสำคัญในการเสริมสร้างพัฒนาการทำงานของสมอง ช่วยให้เด็กเล็กเรียนรู้ได้อย่างสนุกสนานและจดจำได้ดีขึ้น
  - title: สภาพแวดล้อมที่ปลอดภัยและเป็นมิตร
    body: พื้นที่ออกแบบมาเพื่อความปลอดภัยสูงสุด ให้เด็กรู้สึกอบอุ่นเหมือนอยู่บ้าน (Safe, friendly, and supportive learning environments) พร้อมคุณครูที่ดูแลเอาใจใส่อย่างใกล้ชิด
  - title: ปูพื้นฐาน 2 ภาษา (Thai-English)
    body: สร้างความคุ้นเคยกับทั้งภาษาไทยและภาษาอังกฤษผ่านเสียงเพลง นิทาน และการทำกิจกรรมร่วมกัน เพื่อให้เด็กซึมซับภาษาโดยไม่รู้สึกกดดัน
