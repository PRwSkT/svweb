seo:
  th: ["หลักสูตรที่พาเด็กเติบโตอย่างมั่นใจ | โรงเรียนสมคิดวิทยา ระยอง", "เส้นทางการเรียนรู้ที่ต่อเนื่องตั้งแต่ระดับชั้นเตรียมอนุบาลจนถึงประถมศึกษา มุ่งเน้นพัฒนาทักษะทางภาษา กระบวนการคิด การลงมือปฏิบัติจริง และการปลูกฝังให้ผู้เรียนเห็นคุณค่าในตนเอง สมัครเรียนที่โรงเรียนสมคิดวิทยา จ.ระยอง"]
