title: แนวการสอนของเรา
eyebrow: Active Learning / PBL / AI
summary: >-
  แนวการจัดการเรียนรู้ของเราผสานรวม Active Learning, Project-Based Learning และ AI Integration
  อย่างเหมาะสมตามช่วงวัย เพื่อส่งเสริมให้ผู้เรียนได้คิดวิเคราะห์และลงมือสร้างสรรค์อย่างแท้จริง
sections:
  - title: Active Learning
    body: ผู้เรียนมีส่วนร่วมในกระบวนการเรียนรู้ ตั้งคำถาม ทดลองปฏิบัติ และสะท้อนความคิดของตนเอง
  - title: AI Integration
    body: บูรณาการเครื่องมือดิจิทัลเพื่อต่อยอดกระบวนการคิด โดยมุ่งเน้นการเสริมสร้างประสบการณ์การเรียนรู้จริงร่วมกับคุณครู
