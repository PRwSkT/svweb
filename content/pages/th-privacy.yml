lang: "th"
id: "privacy"
path: "/privacy/"
title: "ประกาศความเป็นส่วนตัว"
eyebrow: "Privacy Notice"
summary: "นโยบายคุ้มครองข้อมูลส่วนบุคคล (PDPA) ของโรงเรียนสมคิดวิทยา"
type: "privacy"
sections:
  - title: "1. ข้อมูลที่เราเก็บรวบรวม"
    body: "เมื่อท่านกรอกแบบฟอร์มบนเว็บไซต์ (แบบฟอร์มสมัครเรียน แบบฟอร์มนัดเยี่ยมชม หรือแบบฟอร์มติดต่อ) เราจะเก็บข้อมูลดังนี้:\n- ชื่อ-นามสกุล\n- หมายเลขโทรศัพท์\n- อีเมล\n- ระดับชั้นที่สนใจ\n- ข้อความที่ท่านส่งมา\n\nเราไม่เก็บข้อมูลการเงิน ข้อมูลสุขภาพ หรือข้อมูลที่มีความอ่อนไหวอื่นใดผ่านเว็บไซต์"
  - title: "2. วัตถุประสงค์"
    body: "เราใช้ข้อมูลของท่านเพื่อ:\n- ตอบกลับข้อสอบถามของท่าน\n- ติดต่อนัดหมายการเยี่ยมชมโรงเรียน\n- ดำเนินการเกี่ยวกับการรับสมัครเรียน\n- ส่งข้อมูลที่ท่านร้องขอ\n\nเราจะไม่ใช้ข้อมูลของท่านเพื่อวัตถุประสงค์อื่นนอกเหนือจากที่ระบุ"
  - title: "3. ผู้รับข้อมูล"
    body: "ข้อมูลของท่านจะถูกส่งถึงฝ่ายธุรการและฝ่ายรับสมัครของโรงเรียนสมคิดวิทยาเท่านั้น เราไม่ขาย ไม่ให้เช่า และไม่เปิดเผยข้อมูลของท่านแก่บุคคลภายนอก ยกเว้นเมื่อกฎหมายกำหนด"
  - title: "4. ระยะเวลาจัดเก็บ"
    body: "เราจัดเก็บข้อมูลเป็นระยะเวลาไม่เกิน 2 ปีนับจากวันที่ท่านส่งข้อมูล หรือจนกว่ากระบวนการรับสมัครเสร็จสิ้น แล้วแต่ว่าเหตุการณ์ใดจะเกิดก่อน หลังจากนั้นข้อมูลจะถูกลบออกจากระบบ"
  - title: "5. สิทธิของท่าน"
    body: "ท่านมีสิทธิตาม PDPA ในการ:\n- ขอเข้าถึงข้อมูลของท่าน\n- ขอแก้ไขข้อมูลที่ไม่ถูกต้อง\n- ขอลบข้อมูลของท่าน\n- ขอระงับการใช้ข้อมูล\n- ถอนความยินยอม"
  - title: "6. ช่องทางติดต่อ"
    body: "หากมีคำถามเกี่ยวกับข้อมูลส่วนบุคคลของท่าน กรุณาติดต่อ:\nโรงเรียนสมคิดวิทยา (ฝ่ายธุรการ)\n80/5 ถ.หลังวัดป่า ต.ท่าประดู่ อ.เมืองระยอง จ.ระยอง 21000 ประเทศไทย\nโทร: (+66)38-611251\nอีเมล: mail@somkidvittaya.ac.th"

seo:
  th: ["ประกาศความเป็นส่วนตัว | โรงเรียนสมคิดวิทยา ระยอง", "นโยบายคุ้มครองข้อมูลส่วนบุคคล (PDPA) ของโรงเรียนสมคิดวิทยา สมัครเรียนตั้งแต่ปฐมวัยถึงประถมที่โรงเรียนสมคิดวิทยา จ.ระยอง"]
