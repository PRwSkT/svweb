title: สิ่งอำนวยความสะดวก
eyebrow: เกี่ยวกับเรา
summary: >-
  สำรวจพื้นที่แห่งการเรียนรู้ ห้องเรียน สนาม และพื้นที่ทำกิจกรรม
  ที่ได้รับการออกแบบโดยคำนึงถึงความปลอดภัยและพัฒนาการของผู้เรียนเป็นสำคัญ
sections:
  - title: ห้องเรียน
    body: ห้องเรียนที่ได้รับการออกแบบให้เหมาะสมกับแต่ละช่วงวัย พร้อมสื่อการเรียนรู้ที่กระตุ้นให้เด็ก ๆ ได้ลงมือปฏิบัติจริง
  - title: พื้นที่กิจกรรม
    body: พื้นที่สำหรับรองรับกิจกรรมที่หลากหลาย ทั้งด้านกีฬา ศิลปะ การเรียนรู้ภาษา และกิจกรรมส่งเสริมการเข้าสังคม
nav: about

seo:
  th: ["สิ่งอำนวยความสะดวก | โรงเรียนสมคิดวิทยา ระยอง", "สำรวจพื้นที่แห่งการเรียนรู้ ห้องเรียน สนาม และพื้นที่ทำกิจกรรม ที่ได้รับการออกแบบโดยคำนึงถึงความปลอดภัยและพัฒนาการของผู้เรียน สมัครเรียนที่โรงเรียนสมคิดวิทยา จ.ระยอง"]
