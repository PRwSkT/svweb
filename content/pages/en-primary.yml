sections:
  - title: Bilingual Program
    icon: book-open
    body: >-
      Building upon our Kindergarten curriculum, this program offers a 50/50 balance of English and Thai. Core subjects (Math, Science, Phonics, Art) are taught in English by native speakers to ensure global academic excellence and unleash students' full potential.
  - title: General Program
    icon: award
    body: >-
      A well-rounded curriculum focusing on English for communication, while encouraging individual talents through specialized subjects such as Thai/Western Music, Visual Arts, Sports (Football, Swimming, Taekwondo), Robotics & Computers, and Mental Math.
  - title: Chinese Skills Enhancement
    icon: message-circle
    body: >-
      Students in the General Program also receive Chinese language training to broaden their perspectives and enhance their competitiveness in the digital era, preparing them for global education.
  - title: Leadership Development
    icon: star
    body: >-
      In primary school, we encourage students to discover themselves and express their ideas through Project-Based Learning, developing critical thinking and real-world problem-solving skills.
