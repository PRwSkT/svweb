sections:
  - title: Bilinguals Program
    icon: globe
    body: >-
      Building upon our Kindergarten curriculum, this program offers a 50/50 balance of English and Thai. Core subjects (Math, Science, Phonics, Art) are taught in English by native speakers to ensure global academic excellence. Moreover, students in the Bilinguals Program fully participate in the same specialized activities as the General Program, including Thai/Western Music, Visual Arts, Sports (Football, Swimming, Taekwondo), Robotics & Computers, and Mental Math.
  - title: General Program
    icon: award
    body: >-
      A well-rounded standard curriculum focusing on English for communication, while encouraging individual talents through specialized subjects designed to uncover every child's potential. These include Thai/Western Music, Visual Arts, Sports (Football, Swimming, Taekwondo), Robotics & Computers, and Mental Math.
  - title: Chinese Skills Enhancement
    icon: message-circle
    body: >-
      All students receive Chinese language training to broaden their perspectives and enhance their competitiveness in the digital era, preparing them for global education.
  - title: Leadership Development
    icon: star
    body: >-
      In primary school, we encourage students to discover themselves and express their ideas through Project-Based Learning, developing critical thinking and real-world problem-solving skills.
