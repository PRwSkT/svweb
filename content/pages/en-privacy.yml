lang: "en"
id: "privacy"
path: "/privacy/"
title: "Privacy Notice"
eyebrow: "Privacy Policy"
summary: "How we collect, use, and protect your personal data in accordance with the PDPA."
type: "privacy"
sections:
  - title: "1. Information We Collect"
    body: "When you complete a form on our website (application form, tour booking form, or contact form), we collect:\n- Full name\n- Phone number\n- Email address\n- Grade level of interest\n- Your message\n\nWe do not collect financial data, health data, or any other sensitive data through this website."
  - title: "2. Purpose"
    body: "We use your information to:\n- Respond to your inquiry\n- Arrange a school visit\n- Process your admission application\n- Provide information you have requested\n\nWe will not use your data for any purpose beyond what is stated above."
  - title: "3. Data Recipients"
    body: "Your information is received only by the administrative and admissions teams of Somkidvittaya School. We do not sell, rent, or share your data with third parties, except when required by law."
  - title: "4. Retention Period"
    body: "We retain your data for no longer than two years from the date of submission, or until the admissions process is complete, whichever comes first. After this period, your data will be deleted."
  - title: "5. Your Rights"
    body: "Under the PDPA, you have the right to:\n- Access your personal data\n- Correct inaccurate data\n- Request deletion of your data\n- Restrict data processing\n- Withdraw consent"
  - title: "6. Contact Us"
    body: "For questions about your personal data, please contact:\nSomkidvittaya School (Administration Office)\n80/5 Lang Wat Pa Rd, Tha Pradu, Mueang Rayong, Rayong 21000, Thailand\nTel: (+66)38-611251\nEmail: mail@somkidvittaya.ac.th"

seo:
  en: ["Privacy Notice | Somkidvittaya School Rayong", "How we collect, use, and protect your personal data in accordance with the PDPA."]
