title: สาส์นจากผู้อำนวยการ
type: director
sections:
  - text: >-
      ในนามของโรงเรียนสมคิดวิทยา ผมมีความยินดีอย่างยิ่งที่ได้ต้อนรับทุกท่านเข้าสู่ "บ้านหลังที่สอง" ของเด็ก ๆ พื้นที่ที่เราตั้งใจสร้างสรรค์ให้เป็นมากกว่าสถานศึกษา แต่เป็นพื้นที่ปลอดภัยที่พร้อมโอบรับทุกความแตกต่าง และบ่มเพาะศักยภาพแห่งอนาคตให้กับลูกหลานของเรา
  - text: >-
      ผมมีความเชื่อมั่นเสมอว่า “เด็กทุกคนคือต้นกล้าที่มีคุณค่าและมีศักยภาพไร้ขีดจำกัด” การบริหารและพัฒนาโรงเรียนของเราจึงมุ่งเน้นไปที่การดูแลอนาคตของพวกเขาด้วยความโปร่งใสและรับผิดชอบ เราพร้อมเปิดใจรับฟังและนำเทคโนโลยี นวัตกรรมทางการศึกษาใหม่ ๆ มาประยุกต์ใช้เพื่อก้าวให้ทันโลกอย่างต่อเนื่อง โดยยังคงรักษารากฐานความงดงามของวิถีไทยและศิลปวัฒนธรรมที่เราภาคภูมิใจไว้เป็นเข็มทิศในการดำเนินชีวิต
  - text: >-
      วิสัยทัศน์ที่สำคัญของเรา คือการยกระดับโรงเรียนสมคิดวิทยาให้เป็นสถานศึกษาคุณภาพที่โดดเด่นทั้งด้านวิชาการ คุณธรรม และทักษะแห่งศตวรรษที่ 21 ภายใต้การดูแลอย่างใกล้ชิดของ "ครูยุคใหม่ที่มีหัวใจแห่งการพัฒนา" เรามุ่งสร้างสภาพแวดล้อมที่กระตุ้นให้ผู้เรียนกล้าคิด แก้ปัญหาเป็น สื่อสารอย่างสร้างสรรค์ และรู้เท่าทันเทคโนโลยี เพื่อให้พวกเขาเติบโตเป็นพลเมืองที่มีทั้งความเก่ง ความดี และมีภูมิคุ้มกันพร้อมรับมือกับทุกการเปลี่ยนแปลงในอนาคต
  - highlight: >-
      “ทุกความตั้งใจของเราในวันนี้ คือการสร้างสรรค์พื้นที่แห่งอนาคตที่ดีที่สุดให้กับลูกหลานของเรา เพราะความสำเร็จที่ยิ่งใหญ่ที่สุดของโรงเรียนสมคิดวิทยา คือการได้เห็นเด็ก ๆ เติบโตอย่างงดงามและมีความสุขในทุก ๆ วัน”
  - highlight: >-
      “บริหารด้วยหัวใจ พัฒนาด้วยความรู้ ขับเคลื่อนด้วยคุณธรรม และเติบโตไปพร้อมกับเด็กทุกคน”
  - text: >-
      ขอขอบพระคุณผู้ปกครองและชุมชนทุกท่าน สำหรับความไว้วางใจและการสนับสนุนที่มีให้โรงเรียนสมคิดวิทยาเสมอมา เราจะร่วมกันเป็นรากฐานที่มั่นคง เพื่อสร้างโอกาสและอนาคตที่ดีที่สุดให้กับเด็ก ๆ ของเราทุกคนครับ
