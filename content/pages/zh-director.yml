image: real-1.jpg
title: 校长致辞
type: director
sections:
  - text: >-
      我谨代表 Somkidvittaya 学校，非常荣幸地欢迎大家来到孩子们的“第二个家”。这是一个超越传统教育机构的空间，是一个安全的避风港。我们包容多样性，致力于充分发掘孩子们的潜能。
  - text: >-
      我始终坚信，“每个孩子都是一颗珍贵的幼苗，蕴含无限潜能”。因此，我们的管理与发展始终以“负责任与透明”的态度为核心，为孩子们的未来保驾护航。我们保持开放的心态，不断融入新的教育科技与创新，以紧跟时代发展的步伐；同时，我们也坚定不移地传承泰国传统之美与引以为傲的文化艺术，将其作为孩子们成长道路上的指南针。
  - text: >-
      我们的核心愿景是将 Somkidvittaya 建设成为一所在学术卓越、道德诚信及 21世纪技能方面均出类拔萃的教育机构。在“具备发展思维的现代教育者”的悉心指导下，我们努力打造一个鼓励学生进行批判性思考、解决问题、创造性沟通及掌握现代科技的环境。这确保了他们成长为不仅能力出众、品德高尚，更具韧性且从容应对未来变化的全球公民。
  - highlight: >-
      “我们今天所付出的每一份努力，都是为了给孩子们创造最优质的成长空间。Somkidvittaya 学校最大的成功，便是见证孩子们每一天都在美好与快乐中茁壮成长。”
  - highlight: >-
      “用心管理，以知促行，以德树人，与每一个孩子共同成长。”
  - text: >-
      在此，我要向所有家长及社区各界表达最诚挚的感激之情，感谢你们一直以来对 Somkidvittaya 学校的坚定信任与支持。我们将携手并肩，共同筑牢教育根基，为我们所有的孩子创造最美好的机遇与未来。
signoff:
  name: Nattawat Songkrotham 先生
  title: Somkidvittaya学校校长
