image: real-1.jpg
title: 校长致辞
type: director
sections:
  - text: >-
      我谨代表Somkidvittaya学校，非常荣幸地欢迎大家来到孩子们的“第二个家”——这是一个我们致力于打造的超越传统教育机构的空间。它是一个安全的避风港，准备好包容所有的多样性，并培养我们孩子们未来的潜力。
  - text: >-
      我始终坚信“每个孩子都是一颗珍贵的幼苗，拥有无限的潜力”。因此，我们学校的管理和发展重点是以透明和负责任的态度培育他们的未来。我们始终敞开心扉倾听，并不断整合新的教育技术和创新，以跟上不断发展的世界步伐，同时坚定不移地保留泰国传统的优美和我们引以为豪的文化艺术，将其作为我们生活的指南针。
  - text: >-
      我们的首要愿景是将Somkidvittaya学校提升为一所具有学术卓越、道德诚信和21世纪技能的杰出教育机构。在“具有发展之心的现代教育者”的密切指导下，我们努力创造一个鼓励学生批判性思考、解决问题、创造性沟通和掌握技术的环境。这确保了他们成长为不仅有能力、有道德，而且具有韧性，并准备好应对未来任何变化的公民。
  - highlight: >-
      “我们今天所付出的每一份努力，都是为了给孩子创造最好的未来空间。Somkidvittaya学校最大的成功，就是看到孩子们每天都在美丽和快乐中成长。”
  - highlight: >-
      “用心管理，用知识发展，用美德驱动，与每个孩子一起成长。”
  - text: >-
      我要向所有家长和社区表达最深切的感激之情，感谢你们一直以来给予Somkidvittaya学校的坚定信任和支持。我们将共同建立一个坚实的基础，为我们所有的孩子创造最好的机会和未来。
signoff:
  name: Nattawat Songkrotham 先生
  title: Somkidvittaya学校校长
  image: director.png
