id: manager
path: /manager/
type: director
title:
  th: "สารจากผู้จัดการ"
  en: "Message from the Manager"
  zh: "学校经理致辞"
sections:
  th:
    - >-
      <p class="drop-cap">ที่สมคิดวิทยา เราเชื่อมั่นว่ารากฐานของการศึกษาที่มีคุณภาพ ย่อมเริ่มต้นจากความพร้อมของ Learning Ecosystem หรือระบบนิเวศทางการศึกษาที่แข็งแกร่ง</p><p>หน้าที่สำคัญในการบริหารจัดการองค์รวม จึงเป็นการตั้งใจออกแบบและ Integrate ทุกองค์ประกอบในโรงเรียนให้ทำงานสอดประสานกัน เพื่อขับเคลื่อนวิสัยทัศน์ทางการศึกษาของโรงเรียนให้เกิดขึ้นจริง เราใส่ใจและกำกับดูแลอย่างใกล้ชิด เพื่อ Make sure ว่านิเวศแห่งนี้จะมีความพร้อมสูงสุดในทุก ๆ มิติ</p>
    - >-
      <div class="message-highlight">เราเชื่อมั่นว่ารากฐานทางการศึกษาที่มีคุณภาพ เกิดจากความพร้อมของ Learning Ecosystem เราจึง Make sure ในทุกองค์ประกอบ เพื่อสนับสนุนให้ตอบโจทย์ทุกความสนใจของผู้เรียน ทีม SV ทุกคนพร้อมที่จะร่วมสร้างสรรค์นิเวศแห่งการเรียนรู้แห่งนี้ ให้ตอบรับทุกความต้องการอย่างแท้จริง</div>
    - >-
      <h3>Physical Environment:</h3><p>เรามุ่งมั่นพัฒนาโรงเรียนให้เป็น Safe Zone ที่มีความยืดหยุ่น เราจัดเตรียม Facilities และพื้นที่กิจกรรมที่เปิดกว้าง เพื่อรองรับทุกจินตนาการและตอบโจทย์ความสนใจของเด็ก ๆ อย่างรอบด้าน ให้พวกเขาได้เรียนรู้และ Explore สิ่งใหม่ ๆ ได้อย่างอิสระภายใต้มาตรฐานความปลอดภัยสูงสุด</p>
    - >-
      <h3>System & Management:</h3><p>เรานำเทคโนโลยีและแพลตฟอร์มดิจิทัลเข้ามาเพิ่มประสิทธิภาพในระบบบริหารจัดการ เพื่อลดขั้นตอนการทำงานและยกระดับการสื่อสาร เรามุ่งสร้างระบบที่โปร่งใสและเข้าถึงง่าย เพื่อมอบประสบการณ์ที่ราบรื่นและสร้างความอุ่นใจให้กับผู้ปกครองในทุก ๆ วัน</p>
    - >-
      <h3>Holistic Support:</h3><p>Ecosystem ที่ดีย่อมต้องสามารถ Empower บุคลากรทุกคน เราให้ความสำคัญกับการสนับสนุนทรัพยากรและสภาพแวดล้อมในการทำงาน เพื่อให้คณะครูสามารถลดภาระงานด้านระบบ และนำความมุ่งมั่นทั้งหมดไปโฟกัสกับการดึง Potential ของนักเรียนออกมาได้อย่างเต็มที่</p><p>ความพร้อมในทุกด้านนี้ คือฟันเฟืองสำคัญที่จะ Drive ให้โรงเรียนสมคิดวิทยาเป็นพื้นที่แห่งการเรียนรู้ที่พร้อมตอบสนองต่อโลกยุคใหม่</p>
    - >-
      <div class="message-signoff"><img src="/assets/images/manager.png" alt="นางสาว อติภา สุขศิริ" class="signoff-avatar" width="100" height="100"><div class="signoff-details"><strong>นางสาว อติภา สุขศิริ</strong><span>ผู้จัดการโรงเรียนสมคิดวิทยา</span></div></div>
  en:
    - >-
      <p class="drop-cap">At Somkidvittaya, we believe that the foundation of high-quality education begins with the readiness of a strong Learning Ecosystem.</p><p>Our crucial role in holistic management is to intentionally design and integrate every component of the school so they work in harmony, driving our educational vision into reality. We care and closely oversee everything to make sure this ecosystem is fully prepared in every dimension.</p>
    - >-
      <div class="message-highlight">We believe that a high-quality educational foundation stems from a well-prepared Learning Ecosystem. We prioritize readiness in every component to answer every child's interests. The SV team is dedicated to co-creating this learning ecosystem to truly meet all needs.</div>
    - >-
      <h3>Physical Environment:</h3><p>We are committed to developing the school into a flexible Safe Zone. We provide facilities and open activity areas to support every imagination and comprehensively answer children's interests, allowing them to learn and freely explore new things under the highest safety standards.</p>
    - >-
      <h3>System & Management:</h3><p>We bring in technology and digital platforms to increase efficiency in our management system, reducing workflow and elevating communication. We aim to build a transparent and accessible system to provide a seamless experience and peace of mind for parents every day.</p>
    - >-
      <h3>Holistic Support:</h3><p>A good ecosystem must empower all personnel. We focus on supporting resources and the working environment so that teachers can reduce system-related workloads and channel all their dedication into drawing out the full potential of our students.</p><p>Readiness in all these aspects is the vital gear that drives Somkidvittaya School to be a learning space ready for the modern world.</p>
    - >-
      <div class="message-signoff"><img src="/assets/images/manager.png" alt="Miss Atipa Sooksiri" class="signoff-avatar" width="100" height="100"><div class="signoff-details"><strong>Miss Atipa Sooksiri</strong><span>School Manager</span></div></div>
  zh:
    - >-
      <p class="drop-cap">在Somkidvittaya，我们坚信高质量教育的基础始于强大的学习生态系统。</p><p>我们在整体管理中的重要职责是精心设计并整合学校的每一个组成部分，使它们和谐运作，从而将我们的教育愿景转化为现实。我们用心并密切监督，以确保这个生态系统在各个维度上都达到最高准备状态。</p>
    - >-
      <div class="message-highlight">我们坚信高质量教育的基础源于完备的学习生态系统。我们重视所有要素的准备工作，以满足孩子们的各种兴趣。SV团队致力于共同打造这个学习生态系统，真正满足一切需求。</div>
    - >-
      <h3>物理环境 (Physical Environment):</h3><p>我们致力于将学校建设成为一个灵活的安全区。我们提供开放的设施和活动空间，以全面支持孩子们的想象力和兴趣，让他们在最高安全标准下自由学习和探索新事物。</p>
    - >-
      <h3>系统与管理 (System & Management):</h3><p>我们引入技术和数字平台以提高管理系统的效率，减少工作流程并提升沟通。我们旨在建立一个透明且易于访问的系统，每天为家长提供无缝体验和安心。</p>
    - >-
      <h3>全面支持 (Holistic Support):</h3><p>一个良好的生态系统必须赋能所有人员。我们注重支持资源和工作环境，使教师能够减少与系统相关的工作负担，并将所有精力集中在充分挖掘学生潜力上。</p><p>所有这些方面的准备工作是推动Somkidvittaya学校成为准备好迎接现代世界的学习空间的重要齿轮。</p>
    - >-
      <div class="message-signoff"><img src="/assets/images/manager.png" alt="Atipa Sooksiri 女士" class="signoff-avatar" width="100" height="100"><div class="signoff-details"><strong>Atipa Sooksiri 女士</strong><span>学校经理</span></div></div>
