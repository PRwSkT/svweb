title: 66 ปีแห่งการเรียนรู้และการเติบโต
eyebrow: เกี่ยวกับเรา
summary: >-
  เรื่องราวของโรงเรียนสมคิดวิทยาเริ่มจากความตั้งใจที่จะสร้างพื้นที่เรียนรู้ที่อบอุ่น
  ปลอดภัย และเปิดโลกให้เด็กระยองเติบโตอย่างมั่นใจ
sections:
  - title: ประวัติโรงเรียน
    body: >-
      Timeline 66 ปีแสดงหมุดหมายสำคัญของโรงเรียน
      ตั้งแต่รากฐานของชุมชนจนถึงการพัฒนาสู่โรงเรียนสองภาษา
  - title: สิ่งที่เราเชื่อ
    body: >-
      เด็กเรียนรู้ดีที่สุดเมื่อรู้สึกปลอดภัย ได้ลงมือทำ
      และได้รับการมองเห็นเป็นรายบุคคล
