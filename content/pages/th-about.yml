title: "สมคิดวิทยา: สถาบันแห่งคุณค่า สรรค์สร้างปัญญาเหนือกาลเวลา"
eyebrow: "The Legacy of Somkidvittaya"
summary: >-
  โรงเรียนสมคิดวิทยา มิได้เป็นเพียงสถานศึกษา หากแต่เป็น “สถาบันแห่งคุณค่าและกาลเวลา” ที่ถือกำเนิดขึ้นจากหัวใจแห่งความเมตตาและวิสัยทัศน์อันลึกซึ้ง ตลอดระยะเวลากว่าหกทศวรรษ เราได้หล่อหลอมเยาวชนผ่านการผสานรากฐานทางวัฒนธรรมอันงดงาม เข้ากับนวัตกรรมการเรียนรู้แห่งอนาคต
type: about
nav: about
sections:
  - title: "ปฐมบทแห่งปัญญาและการวางรากฐานอันนิรันดร์"
    subtitle: "Chapter I (พ.ศ. 2503 - 2529)"
    body: >-
      ท่ามกลางบริบทของจังหวัดระยองในยุคที่แสงสว่างทางการศึกษายังแผ่ไปไม่ทั่วถึง ท่านทองอยู่ สุขศิริ (นายกเทศมนตรีเมืองระยองในขณะนั้น) ได้จุดประกายวิสัยทัศน์ที่กลายเป็นรากแก้วสำคัญของสังคม ท่านมิได้เพียงต้องการสร้างโรงเรียน แต่ท่านต้องการสร้าง “มรดกทางปัญญา” ที่จะหยั่งรากลึกและเติบโตเคียงคู่กับชาวระยองไปตลอดกาล
    events:
      - year: "พ.ศ. 2503"
        title: "กำเนิดบ้านหลังแรกแห่งปัญญา"
        text: >-
          โรงเรียนสมคิดวิทยาได้จดบันทึกหน้าแรกของประวัติศาสตร์ขึ้นอย่างเป็นทางการในวันที่ 17 พฤษภาคม โดยมี นายทองอยู่ สุขศิริ เป็นผู้ก่อตั้งและผู้จัดการ นางสมคิด สุภาพ เป็นผู้รับใบอนุญาต และ นายแพน อินทร์ศรี ดำรงตำแหน่งครูใหญ่คนแรก เริ่มต้นจากการบ่มเพาะเมล็ดพันธุ์ในระดับปฐมวัย ภายใต้อาคารครึ่งตึกครึ่งไม้ "อาคารทองอยู่ สุขศิริอนุสรณ์ (๕๐๓)"
      - year: "พ.ศ. 2508"
        title: "การเติบโตจากรากแก้วที่แข็งแกร่ง"
        text: >-
          นายสมหมาย สุขศิริ ผู้รับไม้ต่อในการสานเจตนารมณ์ พร้อมด้วย นายอุทัย ภูมรินทร์ (ครูใหญ่) ได้สร้างก้าวกระโดดครั้งสำคัญ โดยขยายขอบเขตการจัดการศึกษาให้ครอบคลุมถึง ระดับประถมศึกษาและมัธยมศึกษาตอนต้น เพื่อรองรับการเติบโตของเยาวชนในพื้นที่ ให้ได้รับการศึกษาที่ต่อเนื่อง
      - year: "วิถีแห่งความมั่นคง"
        title: "The Rooted Legacy"
        text: >-
          นับแต่วันแรกที่ระฆังใบแรกดังขึ้น สมคิดวิทยาได้ทำหน้าที่เป็น “เข็มทิศ” นำทางเยาวชน การบริหารจัดการในยุคบุกเบิกได้วางระเบียบวินัยและคุณธรรมให้เป็นเสาหลักที่มั่นคงประดุจขุนเขา ส่งต่อเจตนารมณ์จากรุ่นสู่รุ่นว่า ที่นี่มิใช่เพียงสถานที่ให้ความรู้ แต่คือสถาบันที่ “สร้างคน” ให้มีคุณค่าและศักดิ์ศรีอย่างแท้จริง
  - title: "สถาปัตยกรรมแห่งการเรียนรู้และการสืบสานอัตลักษณ์"
    subtitle: "Chapter II (พ.ศ. 2530 - 2543)"
    body: >-
      ยุคแห่งการพลิกโฉมอาคารสถานที่ให้เป็นพื้นที่แห่งการบ่มเพาะศักยภาพ ควบคู่ไปกับการหยั่งรากลึกในความงดงามของศิลปวัฒนธรรมไทย เพื่อสร้างเอกลักษณ์อันโดดเด่นให้แก่สถาบัน
    events:
      - year: "พ.ศ. 2530"
        title: "คุณภาพการดูแลอย่างใกล้ชิด"
        text: >-
          ผู้บริหารตัดสินใจปรับลดเหลือเพียงระดับปฐมวัย เพื่อแก้ไขข้อจำกัดด้านพื้นที่และมุ่งเน้นคุณภาพการดูแลอย่างใกล้ชิดสูงสุด
      - year: "พ.ศ. 2533-2536"
        title: "แผนพัฒนาโครงสร้างพื้นฐาน"
        text: >-
          ภายใต้การดูแลของ นางศศิธร สุขศิริ (ครูใหญ่) โรงเรียนได้เริ่มแผนพัฒนาโครงสร้างพื้นฐานครั้งใหญ่
      - year: "พ.ศ. 2537"
        title: "กลับมาเปิดสอนระดับประถมศึกษา"
        text: >-
          จากเสียงสะท้อนและความศรัทธาของผู้ปกครองที่ประสงค์ให้บุตรหลานได้รับการศึกษาที่ต่อเนื่อง โรงเรียนจึงกลับมาเปิดสอนระดับประถมศึกษาอีกครั้งอย่างภาคภูมิใจ
      - year: "พ.ศ. 2538-2543"
        title: "ยุคทองแห่งการพัฒนา"
        text: >-
          การพัฒนา "Smart Infrastructure" และพื้นที่แห่งสุนทรียภาพ ก่อสร้าง อาคารศิริธรรม 1 และ อาคารศิริธรรม 2 อาคารคอนกรีตเสริมเหล็กที่โอ่โถงและทันสมัย พร้อมพัฒนาพื้นที่เสริมทักษะชีวิตครบวงจร เช่น อาคารโรงอาหาร อาคารฝึกพัฒนาการ (อาคารมหาสนุก) สระว่ายน้ำ
      - year: "พ.ศ. 2542"
        title: "การกำเนิดอัตลักษณ์แห่งความประณีต"
        text: >-
          ก่อสร้าง อาคารกิจกรรมนาฏศิลป์-ดนตรี เพื่อเป็นศูนย์กลางในการหล่อหลอมจิตวิญญาณความเป็นไทย โดยเฉพาะการริเริ่มและสืบสานศิลปะการแสดงชั้นสูงอย่าง “โขน” ซึ่งกลายมาเป็นเครื่องมือสำคัญในการปลูกฝังความประณีต สมาธิ และระเบียบวินัยอันงดงามให้แก่นักเรียนมาจนถึงปัจจุบัน
  - title: "จุดเปลี่ยนผ่านสู่มาตรฐานสากลและความมั่นคง"
    subtitle: "Chapter III (พ.ศ. 2554 - 2567)"
    body: >-
      ในยุคที่โลกไร้พรมแดน โรงเรียนสมคิดวิทยาได้ก้าวข้ามขีดจำกัดเดิม เพื่อยกระดับศักยภาพของผู้เรียนให้ก้าวทันเวทีสากล พร้อมตอกย้ำความแข็งแกร่งในการบริหารงานระดับองค์กร
    events:
      - year: "พ.ศ. 2554"
        title: "ปฐมบทแห่งการศึกษาแบบสองภาษา (The Bilingual Era)"
        text: >-
          โรงเรียนเล็งเห็นว่าภาษาอังกฤษมิใช่เพียงวิชาทางเลือก แต่คือ “ภาษาที่สอง” จึงได้ริเริ่มหลักสูตร Mini English Program (MEP) เพื่อสร้างสภาพแวดล้อมที่เอื้อต่อการซึมซับทักษะทางภาษาอย่างเป็นธรรมชาติ
      - year: "พ.ศ. 2565"
        title: "ยุคสมัยแห่งผู้นำรุ่นใหม่ (The Modern Leadership)"
        text: >-
          นายณัฐวัฒน์ สงเคราะห์ธรรม เข้ารับตำแหน่งผู้อำนวยการ นำพาวิสัยทัศน์แห่งการศึกษาในศตวรรษที่ 21 เข้ามาขับเคลื่อนโรงเรียน สู่การบริหารจัดการที่ทันสมัย เปิดรับนวัตกรรม และตอบโจทย์ความต้องการของผู้เรียนยุคใหม่
      - year: "พ.ศ. 2567"
        title: "รากฐานองค์กรที่แข็งแกร่ง (Corporate Solidification)"
        text: >-
          เพื่อรองรับการเติบโตอย่างยั่งยืน โรงเรียนได้ก้าวสู่โครงสร้างระดับองค์กร โดยโอนกิจการให้ บริษัท ศิริธรรม จำกัด เป็นผู้รับใบอนุญาต ถือเป็นการตอกย้ำความเป็นมืออาชีพ และยกระดับมาตรฐานการบริหารจัดการสู่สากล
  - title: "ก้าวสู่อนาคตแห่งนวัตกร"
    subtitle: "Chapter IV (พ.ศ. 2568 - ปัจจุบัน)"
    body: >-
      ปี พ.ศ. 2568 นับเป็นหมุดหมายแห่งการยกระดับคุณภาพการศึกษาสู่มาตรฐานสากลอย่างเต็มรูปแบบ ภายใต้การบริหารของ นางสาวอติภา สุขศิริ (ผู้จัดการ) โรงเรียนมุ่งเน้นการดึงศักยภาพสูงสุดของผู้เรียน โดยมีเป้าหมายเพื่อสร้าง "นักนวัตกร" (Innovator) ที่พร้อมขับเคลื่อนสังคมในยุค EEC และเวทีโลก
    events:
      - year: "Bilingual Excellence"
        title: "ความเป็นเลิศด้านภาษา"
        text: >-
          ปรับโครงสร้างสู่การเป็นหลักสูตรสองภาษา (MEP) เต็มรูปแบบ 100% เพื่อเพิ่มความเข้มข้นในทักษะภาษาอังกฤษและภาษาต่างประเทศตามมาตรฐานสากล
      - year: "Modern Pedagogies"
        title: "นวัตกรรมการจัดการเรียนรู้"
        text: >-
          เปลี่ยนผ่านรูปแบบการสอนสู่ Child-Centric ผสานกระบวนการ Active Learning และ Project-Based Learning ที่เปิดโอกาสให้เด็กๆ ได้ลงมือปฏิบัติจริง คิดวิเคราะห์ และแก้ไขปัญหาด้วยตนเอง
      - year: "Smart Ecosystem"
        title: "ระบบนิเวศการศึกษาที่ขับเคลื่อนด้วยข้อมูล"
        text: >-
          นำเทคโนโลยีและฐานข้อมูล (Data-Driven) เข้ามามีบทบาทสำคัญในการวิเคราะห์พัฒนาการ เจาะลึกถึงศักยภาพและทักษะที่ต้องเติมเต็มเป็นรายบุคคล ผ่านแพลตฟอร์มการบริหารจัดการที่ทันสมัย
