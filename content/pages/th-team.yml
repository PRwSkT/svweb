title: ทีมผู้บริหารและครู
eyebrow: เกี่ยวกับเรา
summary: >-
  ทำความรู้จักกับคณะผู้บริหารและทีมครูผู้เชี่ยวชาญของเรา
  ที่พร้อมดูแลและส่งเสริมพัฒนาการของผู้เรียนด้วยความรักและความเอาใจใส่
sections:
  - title: คณะผู้บริหาร
    body: ทีมผู้บริหารที่มากด้วยประสบการณ์ มุ่งมั่นพัฒนาการศึกษาเพื่ออนาคตของเด็กๆ
  - title: คณาจารย์
    body: ทีมครูไทยและครูต่างชาติที่เปี่ยมด้วยความสามารถ พร้อมดูแลนักเรียนอย่างใกล้ชิด
nav: about

seo:
  th: ["ทีมผู้บริหารและครู | โรงเรียนสมคิดวิทยา ระยอง", "ทำความรู้จักกับคณะผู้บริหารและทีมครูผู้เชี่ยวชาญของเรา ที่พร้อมดูแลและส่งเสริมพัฒนาการของผู้เรียนด้วยความรักและความเอาใจใส่ สมัครเรียนที่โรงเรียนสมคิดวิทยา จ.ระยอง"]
