  th: ["ส่งข้อมูลสำเร็จ! | โรงเรียนสมคิดวิทยา ระยอง", "ขอบคุณที่ให้ความไว้วางใจในสมคิดวิทยา ทีมงานของเราได้รับข้อมูลของคุณเรียบร้อยแล้ว และจะติดต่อกลับโดยเร็วที่สุด สมัครเรียนตั้งแต่ปฐมวัยถึงประถมที่โรงเรียนสมคิดวิทยา จ.ระยอง"]
