faq:
  th:
    - ["รับสมัครนักเรียนช่วงไหนบ้าง?", "โรงเรียนเปิดรับสมัครนักเรียนใหม่ตั้งแต่เดือนมกราคมของทุกปี สามารถติดต่อเพื่อนัดหมายเข้าชมโรงเรียนได้ตลอดปีการศึกษา"]
    - ["หลักสูตร MEP แตกต่างอย่างไร?", "เราจัดการเรียนการสอนภาษาอังกฤษผ่านกิจกรรม (Active Learning) กับครูต่างชาติ 5-7 คาบต่อสัปดาห์ พร้อมเสริม phonics และทักษะการสนทนาในบริบทจริง"]
    - ["มีบริการรถรับส่งหรือไม่?", "ทางโรงเรียนมีเครือข่ายรถตู้รับส่งนักเรียนที่ปลอดภัย ครอบคลุมหลายพื้นที่ในจังหวัดระยอง สามารถสอบถามเส้นทางได้ที่ธุรการ"]
    - ["เปิดสอนระดับชั้นใดบ้าง?", "รับนักเรียนตั้งแต่ระดับเตรียมอนุบาล (อายุ 2 ขวบขึ้นไป) จนถึงระดับชั้นประถมศึกษาปีที่ 6"]
  en:
    - ["When is the admission period?", "Admissions open in January every year. School tours can be scheduled throughout the academic year."]
    - ["How is the MEP program different?", "We teach English through Active Learning with foreign teachers for 5-7 periods a week, emphasizing phonics and real-world conversation skills."]
    - ["Is school transportation available?", "We coordinate with safe, reliable van services covering most areas in Rayong. Contact the office for specific routes."]
    - ["What grades do you offer?", "We accept students from Pre-Kindergarten (2 years old) through Primary 6 (Grade 6)."]
  zh:
    - ["招生时间是什么时候？", "每年一月开放新生报名。整个学年均可预约参观学校。"]
    - ["MEP 课程有何不同？", "我们通过外教的活动式教学（Active Learning）教授英语，每周5-7节课，强化自然拼读和真实语境中的会话技能。"]
    - ["提供校车服务吗？", "学校协调安全可靠的校车服务，覆盖罗勇府大部分地区。请联系行政办公室查询具体路线。"]
    - ["提供哪些年级的课程？", "我们招收从幼儿预备班（2岁起）至小学六年级的学生。"]

