faq:
  th:
    - ["เปิดรับสมัครนักเรียนช่วงเวลาใดบ้าง?", "โรงเรียนเปิดรับสมัครนักเรียนใหม่ตั้งแต่เดือนมกราคมของทุกปี โดยท่านผู้ปกครองสามารถติดต่อเพื่อนัดหมายเข้าเยี่ยมชมโรงเรียนได้ตลอดปีการศึกษา"]
    - ["หลักสูตร Bilingual ของเรามีความโดดเด่นอย่างไร?", "เราเน้นการเรียนการสอนภาษาอังกฤษผ่านกิจกรรม (Active Learning) กับครูชาวต่างชาติ 5-7 คาบต่อสัปดาห์ ควบคู่ไปกับการปูพื้นฐาน Phonics และฝึกทักษะการสื่อสารในสถานการณ์จริง"]
    - ["ทางโรงเรียนมีบริการรถรับส่งนักเรียนหรือไม่?", "โรงเรียนมีเครือข่ายรถตู้รับส่งที่ได้มาตรฐานความปลอดภัย ครอบคลุมหลายพื้นที่ในจังหวัดระยอง ท่านสามารถสอบถามเส้นทางและรายละเอียดเพิ่มเติมได้ที่ห้องธุรการ"]
    - ["ทางโรงเรียนเปิดสอนในระดับชั้นใดบ้าง?", "เรารับสมัครนักเรียนตั้งแต่ระดับชั้นเตรียมอนุบาล (อายุ 2 ขวบขึ้นไป) จนถึงระดับชั้นประถมศึกษาปีที่ 6"]
  en:
    - ["When is the admission period?", "Admissions open in January every year. Campus tours can be scheduled throughout the academic year."]
    - ["How is the Bilingual program different?", "We teach English through Active Learning with native or fluent foreign teachers for 5-7 periods a week, emphasizing phonics and real-world conversation skills."]
    - ["Is school transportation available?", "We coordinate with safe and reliable van services covering most areas in Rayong. Contact the administration office for specific routes."]
    - ["What grade levels do you offer?", "We accept students from Pre-Kindergarten (2 years old) through Primary 6 (Grade 6)."]
  zh:
    - ["招生时间是什么时候？", "新生报名于每年1月正式启动，学年期间随时欢迎预约探校。"]
    - ["双语课程有何不同？", "我们采用外教沉浸式活动教学（Active Learning），每周5至7节英语课，着重培养自然拼读能力与真实语境下的英语交流技巧。"]
    - ["提供校车服务吗？", "学校提供安全可靠的校车服务，覆盖罗勇府主要区域。详情请咨询行政办公室。"]
    - ["招收哪些年级的学生？", "我校设有幼儿预备班（2岁起）至小学六年级课程。"]

