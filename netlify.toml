[build]
  command = "npm run assets && npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://*.netlify.com https://*.netlify.app;"

[[redirects]]
  from = "https://somkidvittaya.netlify.app/*"
  to = "https://somkidvittaya.ac.th/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/th/*"
  to = "/:splat"
  status = 301
