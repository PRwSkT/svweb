[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https:; connect-src 'self' https://*.netlify.com https://*.netlify.app https://*.supabase.co; frame-src 'self' https://www.google.com https://maps.google.com https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[redirects]]
  from = "https://somkidvittaya.netlify.app/*"
  to = "https://somkidvittaya.ac.th/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/th/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/favicon.png"
  to = "/favicon-32x32.png"
  status = 200

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/apple-touch-icon*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/favicon*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400, must-revalidate"
